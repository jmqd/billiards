<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Billiards app render queue behavior probe</title>
</head>
<body>
  <output id="result">RUNNING</output>
  <script type="module">
    const result = document.querySelector('#result');
    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };
    const deferred = () => {
      let resolve;
      const promise = new Promise((resolvePromise) => { resolve = resolvePromise; });
      return { promise, resolve };
    };
    const withTimeout = (promise, message) => {
      let timeoutId;
      return Promise.race([
        promise,
        new Promise((_, reject) => {
          timeoutId = window.setTimeout(() => reject(new Error(message)), 10000);
        }),
      ]).finally(() => window.clearTimeout(timeoutId));
    };

    const workerCreated = deferred();
    class ControlledRenderWorker extends EventTarget {
      constructor() {
        super();
        this.messages = [];
        this.messageWaiters = [];
        this.terminationCalls = 0;
        workerCreated.resolve(this);
      }

      postMessage(message) {
        this.messages.push(structuredClone(message));
        this.messageWaiters = this.messageWaiters.filter((waiter) => {
          if (this.messages.length < waiter.count) return true;
          waiter.resolve();
          return false;
        });
      }

      whenMessageCount(count) {
        if (this.messages.length >= count) return Promise.resolve();
        return new Promise((resolve) => this.messageWaiters.push({ count, resolve }));
      }

      respond(data) {
        this.dispatchEvent(new MessageEvent('message', { data }));
      }

      get terminated() {
        return this.terminationCalls > 0;
      }

      terminate() {
        this.terminationCalls += 1;
      }
    }
    const controlShortTimers = () => {
      const nativeSetTimeout = window.setTimeout;
      const nativeClearTimeout = window.clearTimeout;
      const callbacks = new Map();
      let nextTimerId = 1_000_000;

      window.setTimeout = (callback, delay = 0, ...args) => {
        if (Number(delay) >= 1000) return nativeSetTimeout.call(window, callback, delay, ...args);
        const timerId = nextTimerId++;
        callbacks.set(timerId, () => callback(...args));
        return timerId;
      };
      window.clearTimeout = (timerId) => {
        if (!callbacks.delete(timerId)) nativeClearTimeout.call(window, timerId);
      };

      return {
        flush() {
          const pending = [...callbacks.values()];
          callbacks.clear();
          pending.forEach((callback) => callback());
        },
        restore() {
          callbacks.clear();
          window.setTimeout = nativeSetTimeout;
          window.clearTimeout = nativeClearTimeout;
        },
      };
    };


    const instrumentShotControlInspections = () => {
      const nativeInstantiate = WebAssembly.instantiate;
      const nativeInstantiateStreaming = WebAssembly.instantiateStreaming;
      let calls = 0;

      const instrumentResult = (result) => {
        const instance = result?.instance;
        const inspect = instance?.exports?.shot_controls_from_dsl;
        if (typeof inspect !== 'function') return result;

        const instrumentedExports = Object.fromEntries(Object.entries(instance.exports));
        instrumentedExports.shot_controls_from_dsl = (...args) => {
          calls += 1;
          return inspect(...args);
        };
        return { instance: { exports: instrumentedExports }, module: result.module };
      };

      WebAssembly.instantiate = async (...args) => instrumentResult(
        await nativeInstantiate.apply(WebAssembly, args),
      );
      if (typeof nativeInstantiateStreaming === 'function') {
        WebAssembly.instantiateStreaming = async (...args) => instrumentResult(
          await nativeInstantiateStreaming.apply(WebAssembly, args),
        );
      }

      return {
        get calls() { return calls; },
        restore() {
          WebAssembly.instantiate = nativeInstantiate;
          if (typeof nativeInstantiateStreaming === 'function') {
            WebAssembly.instantiateStreaming = nativeInstantiateStreaming;
          }
        },
      };
    };

    const loadApplicationMarkup = async () => {
      const response = await fetch('./index.html');
      assert(response.ok, `application markup request failed with ${response.status}`);
      const sourceDocument = new DOMParser().parseFromString(await response.text(), 'text/html');
      const main = sourceDocument.querySelector('main');
      assert(main, 'application markup must contain its main controls');
      document.body.append(document.importNode(main, true));
    };

    const loadViewer = () => new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = './billiards-viewer.js';
      script.addEventListener('load', resolve, { once: true });
      script.addEventListener('error', () => reject(new Error('viewer script failed to load')), { once: true });
      document.head.append(script);
    });

    const topContactGeometry = (view) => {
      const ghostShell = view.querySelector('.contact-ball-ghost .contact-ball-shell');
      const objectShell = view.querySelector('.contact-ball:not(.contact-ball-ghost) .contact-ball-shell');
      const guidePath = view.querySelector('.contact-shot-guide')?.getAttribute('d');
      const arrowPath = view.querySelector('.contact-shot-arrow')?.getAttribute('d');
      assert(
        ghostShell && objectShell && guidePath && arrowPath,
        'the top contact view must expose both balls and its travel guide',
      );
      const ballGeometry = (shell) => ({
        x: Number(shell.getAttribute('cx')),
        y: Number(shell.getAttribute('cy')),
        radius: Number(shell.getAttribute('r')),
      });
      const pathNumbers = (path) => (path.match(/-?\d+(?:\.\d+)?/g) ?? []).map(Number);
      return {
        ghost: ballGeometry(ghostShell),
        object: ballGeometry(objectShell),
        guide: pathNumbers(guidePath),
        arrow: pathNumbers(arrowPath),
      };
    };

    const assertBottomUpContactGeometry = (geometry, context) => {
      const { ghost, object, guide, arrow } = geometry;
      assert(
        ghost.x === 72 && ghost.y === 70 && object.y < ghost.y,
        `${context}: the ghost ball must stay fixed below the object ball`,
      );
      assert(
        guide.length === 4
          && guide[0] === ghost.x
          && guide[2] === ghost.x
          && guide[1] > guide[3],
        `${context}: the shot guide must run vertically upward into the ghost ball`,
      );
      assert(
        arrow.length === 6
          && arrow[0] === ghost.x
          && arrow[1] < arrow[3]
          && arrow[1] < arrow[5],
        `${context}: the shot arrow must point directly up the page`,
      );
      for (const ball of [ghost, object]) {
        assert(
          ball.x - ball.radius >= 4
            && ball.x + ball.radius <= 140
            && ball.y - ball.radius >= 4
            && ball.y + ball.radius <= 108,
          `${context}: contact balls must remain inside the guide panel`,
        );
      }
    };

    const firstObjectContact = {
      time: 0.369,
      cueBall: ['cue', '#f8f4e8', null, 10, 1.125, 'plain', null, null],
      objectBall: ['yellow', '#f1c232', null, 10, 1.125, 'plain', null, null],
      cutAngleDegrees: 30.2,
      hitFraction: 0.497,
      lateralOffsetDiameters: 0.503,
      forwardOffsetDiameters: 0.864,
      verticalOffsetDiameters: 0,
      airborne: false,
    };
    const report = (version, contact = null) => ({
      svg: `<svg viewBox="0 0 1 1" data-render-version="${version}" aria-label="${version} render"><circle cx="0.5" cy="0.5" r="0.25"></circle></svg>`,
      events: [],
      firstObjectContact: contact,
      playback: null,
    });
    const workerError = (phase, name, message) => ({
      phase,
      name,
      message,
      stack: `${name}: ${message}\n    at controlled worker`,
      runtime: {
        userAgent: 'app protocol probe',
        platform: 'test platform',
        architecture: 'arm',
        bitness: '64',
        hardwareConcurrency: 8,
      },
    });

    const run = async () => {
      await loadApplicationMarkup();
      await loadViewer();

      const nativeWorker = window.Worker;
      const controlledTimers = controlShortTimers();
      const shotControlInspections = instrumentShotControlInspections();
      window.Worker = ControlledRenderWorker;
      try {
        await import('./app.js?render-queue-regression');
        const worker = await withTimeout(
          workerCreated.promise,
          'application must delegate rendering to a background worker',
        );
        await withTimeout(
          worker.whenMessageCount(1),
          'application must send its initial render to the worker',
        );

        const [initialRequest] = worker.messages;
        const headingInput = document.querySelector('#heading-input');
        const dslInput = document.querySelector('#dsl-input');
        const increaseHeading = document.querySelector('[data-heading-delta="1"]');
        const preview = document.querySelector('#preview');
        const speedInput = document.querySelector('#speed-input');
        const speedRange = document.querySelector('#speed-range');
        const speedHint = document.querySelector('#speed-hint');
        const speedUnit = speedInput?.nextElementSibling;
        const previewCard = document.querySelector('.wasm-report-card');
        const previewState = document.querySelector('#preview-state');
        const renderButton = document.querySelector('#render-button');
        const resetButton = document.querySelector('#reset-button');
        const downloadButton = document.querySelector('#download-button');
        const shotControls = document.querySelector('#shot-controls');
        const shotFieldsets = [...shotControls.querySelectorAll('fieldset')];
        const status = document.querySelector('#status');
        const appShell = document.querySelector('.app-shell');
        const dslPanel = document.querySelector('.dsl-panel');
        assert(
          dslPanel && [...appShell.children].at(-1) === dslPanel,
          'advanced DSL editor must follow the shot workspace and scenario report',
        );
        assert(Number.isFinite(headingInput.valueAsNumber), 'Wasm must expose the configured heading');
        assert(increaseHeading && !increaseHeading.disabled, 'heading control must be interactive');
        assert(speedInput && !speedInput.matches(':disabled'), 'metric speed control must be interactive');

        const initialMetricSpeedMax = '56.32704';
        assert(
          speedInput.max === initialMetricSpeedMax,
          'ordinary speed must initialize the precise input max to exactly 56.32704 km/h',
        );

        const abovePresetMetricSpeed = '64.008';
        speedInput.value = abovePresetMetricSpeed;
        speedInput.dispatchEvent(new Event('change', { bubbles: true }));

        assert(
          dslInput.value.includes('.speed(700ips)'),
          '64.008 km/h entered through the precise speed control must write exactly .speed(700ips)',
        );
        assert(
          speedInput.value === abovePresetMetricSpeed,
          'precise speed must resync to 64.008 km/h without clamping to the old preset ceiling',
        );
        assert(
          speedRange.value === abovePresetMetricSpeed,
          'speed range must resync to 64.008 km/h without clamping to the old preset ceiling',
        );
        assert(
          speedInput.max === abovePresetMetricSpeed
            && speedInput.getAttribute('max') === abovePresetMetricSpeed,
          'precise speed max property and attribute must expand to exactly 64.008 km/h',
        );
        assert(
          speedRange.max === abovePresetMetricSpeed
            && speedRange.getAttribute('max') === abovePresetMetricSpeed,
          'speed range max property and attribute must expand to exactly 64.008 km/h',
        );

        const metricSpeed = '32.18688';
        speedInput.value = metricSpeed;
        speedInput.dispatchEvent(new Event('change', { bubbles: true }));

        const metricSource = dslInput.value;
        assert(
          metricSource.includes('.speed(352ips)'),
          '32.18688 km/h must round-trip through Rust as exactly .speed(352ips)',
        );
        assert(
          !metricSource.includes('.speed(352.00000000000006ips)'),
          'metric conversion must not leak a floating-point artifact into the DSL',
        );
        assert(speedInput.value === metricSpeed, 'precise speed must remain 32.18688 km/h after Rust sync');
        assert(speedRange.value === metricSpeed, 'speed range must remain at 32.18688 km/h after Rust sync');
        assert(
          speedHint?.value === 'power speed' && speedHint.textContent.trim() === 'power speed',
          '352 ips must expose the friendly power speed hint',
        );
        assert(
          speedRange.getAttribute('aria-valuetext') === '32.18688 kilometers per hour, power speed',
          'speed range ARIA text must expose the converted metric speed and friendly hint',
        );
        assert(
          speedUnit?.textContent.trim() === 'km/h' && speedUnit.getAttribute('aria-hidden') === 'true',
          'precise speed must retain its visible km/h unit',
        );

        const escapedComment = '# Browser JSON round trip preserves "quoted" and a literal \\ backslash';
        dslInput.value = `${escapedComment}\n${dslInput.value}`;
        const inspectionsBeforeSourceInput = shotControlInspections.calls;
        dslInput.dispatchEvent(new Event('input', { bubbles: true }));
        assert(
          shotControlInspections.calls === inspectionsBeforeSourceInput + 1,
          'textarea input must configure the escaped source through one Wasm inspection',
        );

        const startingHeading = headingInput.valueAsNumber;
        const inspectionsBeforeControlEdit = shotControlInspections.calls;
        increaseHeading.click();

        const firstExpectedHeading = (startingHeading + 1) % 360;
        assert(
          Math.abs(headingInput.valueAsNumber - firstExpectedHeading) < 1e-9,
          `returned controls must synchronously update heading to ${firstExpectedHeading}`,
        );
        assert(
          dslInput.value.split('\n').includes(escapedComment),
          'Wasm update JSON must preserve the exact quoted and backslashed comment line',
        );
        assert(
          shotControlInspections.calls === inspectionsBeforeControlEdit,
          'control update must consume returned controls without a second Wasm inspection',
        );

        increaseHeading.click();
        increaseHeading.click();

        const expectedHeading = (startingHeading + 3) % 360;
        assert(
          Math.abs(headingInput.valueAsNumber - expectedHeading) < 1e-9,
          `heading must reach ${expectedHeading} while the expensive render is still pending`,
        );
        const newestSource = dslInput.value;
        assert(newestSource !== initialRequest.source, 'rapid controls must configure a newer DSL source');
        controlledTimers.flush();
        assert(
          worker.messages.length === 1,
          `only one render may be in flight, got ${worker.messages.length}`,
        );

        worker.respond({ id: initialRequest.id, report: report('stale'), elapsedMs: 9000 });

        assert(
          !preview.querySelector('[data-render-version="stale"]'),
          'a stale worker result must not replace the configured preview',
        );
        assert(
          worker.messages.length === 2,
          'finishing a stale render must immediately request the newest configured source',
        );
        const newestRequest = worker.messages[1];
        assert(
          newestRequest.source === newestSource,
          'the queued render must use the latest source after rapid heading changes',
        );
        assert(
          newestRequest.source.includes('.speed(352ips)'),
          'the queued Rust-updated render must retain the exact 352 ips DSL speed',
        );
        assert(
          newestRequest.source.split('\n').includes(escapedComment),
          'the queued newest source must preserve the exact quoted and backslashed comment line',
        );

        worker.respond({
          id: newestRequest.id,
          report: report('newest', firstObjectContact),
          elapsedMs: 1,
        });
        assert(
          preview.querySelector('[data-render-version="newest"]'),
          'the newest worker result must become the visible preview',
        );
        const contactOverview = preview.querySelector('.card-overview');
        const elevatedContactView = preview.querySelector('.contact-elevated-view');
        const topContactView = preview.querySelector('.contact-top-view');
        const contactInfo = Object.fromEntries(
          [...preview.querySelectorAll('.card-overview .info-row')].map((row) => [
            row.querySelector('dt')?.textContent.trim(),
            row.querySelector('dd')?.textContent.trim(),
          ]),
        );
        assert(
          contactOverview && !contactOverview.classList.contains('card-overview-full')
            && preview.querySelectorAll('.contact-visual-panel').length === 2,
          'a first object contact must add both visual aids beside the report metadata',
        );
        assert(
          elevatedContactView?.getAttribute('role') === 'img'
            && elevatedContactView.getAttribute('aria-label').includes('49.7% full, 30.2° cut'),
          'the elevated fullness view must expose its percentage and cut angle accessibly',
        );
        assert(
          topContactView?.getAttribute('role') === 'img'
            && topContactView.getAttribute('aria-label').includes('Top-down ghost-ball view')
            && topContactView.querySelector('.contact-ball-ghost'),
          'the bird-eye view must identify and draw the cue ghost ball accessibly',
        );
        const firstContactGeometry = topContactGeometry(topContactView);
        assertBottomUpContactGeometry(firstContactGeometry, 'positive lateral contact');
        assert(
          Math.abs(
            firstContactGeometry.object.x
              - (firstContactGeometry.ghost.x + firstObjectContact.lateralOffsetDiameters * 40)
          ) < 1e-3
            && Math.abs(
              firstContactGeometry.object.y
                - (firstContactGeometry.ghost.y - firstObjectContact.forwardOffsetDiameters * 40)
            ) < 1e-3,
          'the top contact view must rotate the cue-frame contact vector into page coordinates',
        );

        assert(
          contactInfo['First contact'] === 'cue ball → yellow ball at 0.369 s'
            && contactInfo['Hit fullness'] === '49.7%'
            && contactInfo['Cut angle'] === '30.2°',
          'first-contact metadata must agree with the visual aids',
        );

        const outcomeSummary = (scored) => ({
          requested: 8,
          scored,
          scoredObjectFirst: scored,
          missed: 8 - scored,
          indeterminate: 0,
          failed: 0,
          successRate: scored / 8,
          confidenceLow: scored / 16,
          confidenceHigh: Math.min(1, scored / 8 + 0.25),
          eligible: true,
        });
        const candidate = (rank, candidateId, controls, scored) => ({
          rank,
          candidateId,
          controls,
          nominalScored: true,
          screening: outcomeSummary(scored),
          validation: outcomeSummary(scored),
        });
        const winner = candidate(
          1,
          101,
          {
            headingDegrees: 111.25,
            speedIps: 140,
            tipSide: 0.1,
            tipHeight: 0.2,
            cueElevationDegrees: 2,
          },
          7,
        );
        const second = candidate(
          2,
          202,
          {
            headingDegrees: 222.5,
            speedIps: 175,
            tipSide: -0.2,
            tipHeight: 0.25,
            cueElevationDegrees: 3.5,
          },
          6,
        );
        const robustSearchForm = document.querySelector('#robust-search-form');
        const robustIterationsInput = document.querySelector('#robust-iterations');
        const robustPlayerLevelSelect = document.querySelector('#robust-player-level');
        const robustSearchButton = document.querySelector('#robust-search-button');
        const robustSearchStatus = document.querySelector('#robust-search-status');
        assert(
          robustIterationsInput.max === '128000',
          'robust search must expose the 128,000-evaluation frontend limit',
        );
        const originalRobustIterations = robustIterationsInput.value;
        robustIterationsInput.value = '128000';
        assert(
          robustIterationsInput.checkValidity(),
          'robust search must accept 128,000 frontend evaluations',
        );
        robustIterationsInput.value = '128001';
        assert(
          !robustIterationsInput.checkValidity(),
          'robust search must reject 128,001 frontend evaluations',
        );
        robustIterationsInput.value = originalRobustIterations;
        robustSearchForm.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
        await withTimeout(
          worker.whenMessageCount(3),
          'submitting robust search must delegate the experiment to the worker',
        );
        const malformedRobustRequest = worker.messages[2];
        assert(
          malformedRobustRequest.action === 'robust-shot-search',
          'robust search must use the dedicated worker action',
        );
        worker.respond({
          id: malformedRobustRequest.id,
          action: malformedRobustRequest.action,
          error: { unexpectedBigInt: 1n },
        });
        await Promise.resolve();
        await Promise.resolve();

        const invalidErrorResponse = 'The background renderer returned an invalid error response.';
        assert(
          robustSearchStatus.dataset.kind === 'error'
            && robustSearchStatus.textContent === invalidErrorResponse,
          'an unserializable malformed worker error must show the invalid-response status',
        );
        assert(
          robustSearchForm.getAttribute('aria-busy') === 'false'
            && !robustIterationsInput.disabled
            && !robustPlayerLevelSelect.disabled
            && !robustSearchButton.disabled,
          'a malformed worker error must re-enable the search form',
        );
        assert(
          !worker.terminated && worker.terminationCalls === 0,
          'a malformed worker error must not terminate the worker',
        );

        robustSearchForm.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
        await withTimeout(
          worker.whenMessageCount(4),
          'a search after a malformed error must reuse the worker',
        );
        const failedRobustRequest = worker.messages[3];
        assert(
          failedRobustRequest.action === malformedRobustRequest.action
            && failedRobustRequest.source === malformedRobustRequest.source
            && failedRobustRequest.iterations === malformedRobustRequest.iterations
            && failedRobustRequest.playerLevel === malformedRobustRequest.playerLevel,
          'the search after a malformed error must retry the unchanged request',
        );
        const robustFailureMessage = 'injected robust search failure';
        worker.respond({
          id: failedRobustRequest.id,
          action: failedRobustRequest.action,
          error: workerError('robust-shot-search', 'RangeError', robustFailureMessage),
        });
        await Promise.resolve();
        await Promise.resolve();
        const expectedRobustFailure = `robust-shot-search failed (RangeError): ${robustFailureMessage}`;
        assert(
          robustSearchStatus.dataset.kind === 'error'
            && robustSearchStatus.textContent === expectedRobustFailure,
          'robust search failure must show the exact structured worker error',
        );
        assert(
          robustSearchForm.getAttribute('aria-busy') === 'false'
            && !robustIterationsInput.disabled
            && !robustPlayerLevelSelect.disabled
            && !robustSearchButton.disabled
            && robustSearchButton.textContent === 'Find robust shot',
          'robust search failure must re-enable the search form',
        );
        assert(
          !worker.terminated && worker.terminationCalls === 0,
          'robust search failure must not terminate the worker',
        );

        robustSearchForm.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
        await withTimeout(
          worker.whenMessageCount(5),
          'a following robust search must reuse the worker',
        );
        const robustRequest = worker.messages[4];
        assert(
          robustRequest.action === failedRobustRequest.action
            && robustRequest.source === failedRobustRequest.source
            && robustRequest.iterations === failedRobustRequest.iterations
            && robustRequest.playerLevel === failedRobustRequest.playerLevel,
          'the following search must retry the unchanged request',
        );
        worker.respond({
          id: robustRequest.id,
          action: robustRequest.action,
          search: {
            winner,
            rankedFinalists: [winner, second],
            sourceHasShot: true,
            playerLevelLabel: 'A player',
            shotInaccuracySigmas: {
              headingDegrees: 0.6,
              speedIps: 3.5,
              tipSideRadii: 0.018,
              tipHeightRadii: 0.018,
              cueElevationDegrees: 0.35,
            },
            actualIterations: 16,
            plannedIterations: 16,
            requestedIterations: 16,
            validatedFinalistCount: 2,
          },
          elapsedMs: 4,
        });
        await Promise.resolve();
        await Promise.resolve();

        const candidateButtons = [...document.querySelectorAll('.robust-candidate-apply')];
        assert(
          candidateButtons.length === 2
            && candidateButtons[0].textContent.trim() === 'Apply #1'
            && candidateButtons[1].textContent.trim() === 'Apply #2'
            && candidateButtons.every((button) => !button.disabled),
          'every ranked finalist must expose an enabled apply action',
        );
        const sourceBeforeSecondCandidate = dslInput.value;
        candidateButtons[1].click();
        assert(
          dslInput.value !== sourceBeforeSecondCandidate
            && dslInput.value.includes('.heading(222.5deg)')
            && dslInput.value.includes('.speed(175ips)'),
          'applying candidate #2 must write that candidate controls into the DSL',
        );
        assert(
          Math.abs(headingInput.valueAsNumber - second.controls.headingDegrees) < 1e-9,
          'applying candidate #2 must synchronize the live heading control',
        );
        assert(
          document.querySelector('#robust-search-status').textContent.includes('Candidate 202 applied')
            && !candidateButtons[0].disabled
            && candidateButtons[0].textContent.trim() === 'Apply #1'
            && candidateButtons[1].disabled
            && candidateButtons[1].textContent.trim() === 'Applied #2'
            && candidateButtons[1].getAttribute('aria-label') === 'Ranked candidate 2 applied',
          'applying candidate #2 must keep other finalists available and mark #2 active',
        );
        controlledTimers.flush();
        await withTimeout(
          worker.whenMessageCount(6),
          'applying candidate #2 must queue its updated DSL for rendering',
        );
        const secondCandidateRender = worker.messages[5];
        assert(
          secondCandidateRender.source === dslInput.value,
          'candidate #2 render must use the exact DSL produced by the Wasm update',
        );
        worker.respond({
          id: secondCandidateRender.id,
          report: report('second-candidate'),
          elapsedMs: 1,
        });
        assert(
          preview.querySelector('.card-overview')?.classList.contains('card-overview-full')
            && !preview.querySelector('.contact-visual-stack'),
          'a report without object contact must retain the full-width metadata layout',
        );

        candidateButtons[0].click();
        assert(
          dslInput.value.includes('.heading(111.25deg)')
            && dslInput.value.includes('.speed(140ips)')
            && Math.abs(headingInput.valueAsNumber - winner.controls.headingDegrees) < 1e-9,
          'applying candidate #1 after #2 must replace the DSL and live controls with #1',
        );
        assert(
          candidateButtons[0].disabled
            && candidateButtons[0].textContent.trim() === 'Applied #1'
            && !candidateButtons[1].disabled
            && candidateButtons[1].textContent.trim() === 'Apply #2'
            && candidateButtons[0].getAttribute('aria-label') === 'Ranked candidate 1 applied'
            && candidateButtons[1].getAttribute('aria-label') === 'Apply ranked candidate 2',
          'switching to #1 must keep #2 available and mark only #1 active',
        );
        controlledTimers.flush();
        await withTimeout(
          worker.whenMessageCount(7),
          'switching candidates must queue the newly selected DSL for rendering',
        );
        const appliedCandidateRender = worker.messages[6];
        assert(
          appliedCandidateRender.source === dslInput.value,
          'switched candidate render must use the exact selected DSL',
        );
        worker.respond({
          id: appliedCandidateRender.id,
          report: report('applied-candidate'),
          elapsedMs: 1,
        });
        increaseHeading.click();
        controlledTimers.flush();
        await withTimeout(
          worker.whenMessageCount(8),
          'changing heading must request another contact visualization',
        );
        const oppositeHeadingRender = worker.messages[7];
        assert(
          oppositeHeadingRender.source !== appliedCandidateRender.source,
          'the opposite-cut visualization must be rendered for a different heading',
        );
        const oppositeContact = {
          ...firstObjectContact,
          lateralOffsetDiameters: -1.05,
          forwardOffsetDiameters: 1.05,
        };
        worker.respond({
          id: oppositeHeadingRender.id,
          report: report('opposite-heading-contact', oppositeContact),
          elapsedMs: 1,
        });
        const oppositeTopContactView = preview.querySelector('.contact-top-view');
        const oppositeContactGeometry = topContactGeometry(oppositeTopContactView);
        assertBottomUpContactGeometry(oppositeContactGeometry, 'negative lateral contact');
        assert(
          oppositeContactGeometry.object.x < oppositeContactGeometry.ghost.x
            && firstContactGeometry.object.x > firstContactGeometry.ghost.x
            && oppositeContactGeometry.ghost.x === firstContactGeometry.ghost.x
            && oppositeContactGeometry.ghost.y === firstContactGeometry.ghost.y,
          'opposite cuts must move only the object-ball side while the ghost ball stays at the bottom',
        );


        dslInput.value = `# Manual edit invalidates candidate actions\n${dslInput.value}`;
        dslInput.dispatchEvent(new Event('input', { bubbles: true }));
        assert(
          candidateButtons.every((button) => button.disabled)
            && document.querySelector('#robust-search-status').textContent.includes('DSL changed'),
          'a manual DSL edit must disable every candidate from the stale search',
        );

        const messagesBeforeFatal = worker.messages.length;
        const fatalMessage = 'synthetic Wasm initialization failure';
        const fatalError = workerError('initialization', 'Error', fatalMessage);
        worker.respond({ fatal: true, error: fatalError });

        assert(
          worker.terminated && worker.terminationCalls === 1,
          `fatal initialization must terminate the worker exactly once, got ${worker.terminationCalls}`,
        );
        assert(
          renderButton.disabled && resetButton.disabled,
          'fatal initialization must disable render and reset actions',
        );
        assert(
          shotControls.hidden
            && shotFieldsets.length > 0
            && shotFieldsets.every((fieldset) => fieldset.disabled)
            && increaseHeading.matches(':disabled')
            && speedInput.matches(':disabled'),
          'fatal initialization must hide and disable every interactive shot control',
        );
        assert(
          preview.querySelector('[data-render-version="opposite-heading-contact"]'),
          'fatal initialization must retain the last successful preview',
        );
        assert(
          previewCard.dataset.previewStale === 'true'
            && previewCard.classList.contains('is-stale')
            && !previewState.hidden,
          'fatal initialization must visibly mark the retained preview stale',
        );
        assert(
          downloadButton.disabled && preview.querySelector('#inline-download-button')?.disabled,
          'fatal initialization must disable downloads of the stale preview',
        );
        const expectedFatalStatus = `initialization failed (Error): ${fatalMessage}`;
        assert(
          status.classList.contains('error') && status.textContent === expectedFatalStatus,
          'fatal status must show the initialization phase, name, and message',
        );
        assert(
          robustSearchStatus.dataset.kind === 'error'
            && robustSearchStatus.textContent === expectedFatalStatus,
          'fatal robust-search status must show the initialization phase, name, and message',
        );

        controlledTimers.flush();
        assert(
          worker.messages.length === messagesBeforeFatal,
          'fatal initialization must not request or retry another worker render',
        );
      } finally {
        shotControlInspections.restore();
        controlledTimers.restore();
        window.Worker = nativeWorker;
      }
    };

    try {
      await run();
      document.documentElement.dataset.testStatus = 'passed';
      result.textContent = 'PASS';
    } catch (error) {
      document.documentElement.dataset.testStatus = 'failed';
      result.textContent = `FAIL: ${error.message}`;
      console.error(error);
    }
  </script>
</body>
</html>
